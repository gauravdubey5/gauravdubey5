<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1D"/>
      <stop offset="50%" stop-color="#0D1A30"/>
      <stop offset="100%" stop-color="#080F1D"/>
    </linearGradient>
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Consolas', 'Fira Code', 'Roboto Mono', monospace; }
  </style>

  <rect x="2" y="2" width="1196" height="126" rx="14" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.5"/>

  <!-- Centered Message -->
  <g transform="translate(600, 48)">
    <text x="0" y="0" fill="#EAF2FF" class="font-sans" font-size="18" font-weight="700" text-anchor="middle">
      "Building reliable infrastructure. Automating everything possible. Learning continuously."
    </text>
    <text x="0" y="32" fill="#94A3B8" class="font-mono" font-size="12" text-anchor="middle">
      Azure Cloud &amp; DevOps Engineering Portfolio • Gaurav Dubey • Built with Precision
    </text>
    <circle cx="-130" cy="50" r="3.5" fill="#10B981"/>
    <text x="0" y="54" fill="#38BDF8" class="font-mono" font-size="11" text-anchor="middle">
      PRODUCTION INFRASTRUCTURE • CONTINUOUS INTEGRATION • IMMUTABLE DELIVERY
    </text>
  </g>
</svg>
