<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09172E"/>
      <stop offset="100%" stop-color="#060E1C"/>
    </linearGradient>
    <linearGradient id="p3Border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Consolas', 'Fira Code', 'Roboto Mono', monospace; }
  </style>

  <rect x="2" y="2" width="796" height="236" rx="12" fill="url(#p3Grad)" stroke="url(#p3Border)" stroke-width="1.8"/>

  <!-- Top Badge -->
  <g transform="translate(25, 22)">
    <rect x="0" y="0" width="150" height="22" rx="4" fill="#0078D4" fill-opacity="0.25" stroke="#0078D4" stroke-width="1"/>
    <text x="75" y="15" fill="#38BDF8" class="font-mono" font-size="10" font-weight="700" text-anchor="middle">FULL-STACK APP 03</text>
    <text x="165" y="17" fill="#EAF2FF" class="font-sans" font-size="16" font-weight="700">SmartLearn AI — Cloud-Native EdTech Platform</text>
  </g>

  <!-- Technical Highlights Graphic -->
  <g transform="translate(25, 60)">
    <rect x="0" y="0" width="750" height="95" rx="8" fill="#0A162B" stroke="#1E3A8A" stroke-width="1"/>

    <!-- Pillar 1: Backend Architecture -->
    <g transform="translate(20, 16)">
      <circle cx="16" cy="16" r="16" fill="#0F284A"/>
      <text x="16" y="21" fill="#38BDF8" class="font-mono" font-size="14" text-anchor="middle">🐍</text>
      <text x="42" y="16" fill="#BAE6FD" class="font-mono" font-size="12" font-weight="700">Python &amp; Flask</text>
      <text x="42" y="34" fill="#94A3B8" class="font-sans" font-size="11">Modular RESTful controllers &amp; routing layer</text>
    </g>

    <!-- Pillar 2: Database Schemas -->
    <g transform="translate(260, 16)">
      <circle cx="16" cy="16" r="16" fill="#0F284A"/>
      <text x="16" y="21" fill="#38BDF8" class="font-mono" font-size="14" text-anchor="middle">🗄️</text>
      <text x="42" y="16" fill="#BAE6FD" class="font-mono" font-size="12" font-weight="700">SQLite &amp; Student DB</text>
      <text x="42" y="34" fill="#94A3B8" class="font-sans" font-size="11">Relational schema for student &amp; course tracking</text>
    </g>

    <!-- Pillar 3: Containerization -->
    <g transform="translate(510, 16)">
      <circle cx="16" cy="16" r="16" fill="#0F284A"/>
      <text x="16" y="21" fill="#38BDF8" class="font-mono" font-size="14" text-anchor="middle">🐳</text>
      <text x="42" y="16" fill="#BAE6FD" class="font-mono" font-size="12" font-weight="700">Docker Packaging</text>
      <text x="42" y="34" fill="#94A3B8" class="font-sans" font-size="11">Containerized deployment readiness for Cloud</text>
    </g>

    <!-- Bottom Specs Ribbon -->
    <rect x="0" y="65" width="750" height="30" rx="0" fill="#07101E"/>
    <text x="25" y="85" fill="#38BDF8" class="font-mono" font-size="10">MODULES: dashboard.py • student.py • course.py • create_db.py</text>
    <text x="560" y="85" fill="#10B981" class="font-mono" font-size="10">CONTAINER READY</text>
  </g>

  <!-- Tags Row -->
  <g transform="translate(25, 175)">
    <rect x="0" y="0" width="100" height="26" rx="5" fill="#0D203D" stroke="#0078D4" stroke-width="0.8"/>
    <text x="50" y="17" fill="#BAE6FD" class="font-mono" font-size="11" text-anchor="middle">Python 3.11</text>

    <rect x="110" y="0" width="110" height="26" rx="5" fill="#0D203D" stroke="#0078D4" stroke-width="0.8"/>
    <text x="165" y="17" fill="#BAE6FD" class="font-mono" font-size="11" text-anchor="middle">Flask Backend</text>

    <rect x="230" y="0" width="110" height="26" rx="5" fill="#0D203D" stroke="#0078D4" stroke-width="0.8"/>
    <text x="285" y="17" fill="#BAE6FD" class="font-mono" font-size="11" text-anchor="middle">SQLite Storage</text>

    <rect x="350" y="0" width="130" height="26" rx="5" fill="#0D203D" stroke="#0078D4" stroke-width="0.8"/>
    <text x="415" y="17" fill="#BAE6FD" class="font-mono" font-size="11" text-anchor="middle">Student Analytics</text>

    <rect x="490" y="0" width="130" height="26" rx="5" fill="#0D203D" stroke="#0078D4" stroke-width="0.8"/>
    <text x="555" y="17" fill="#BAE6FD" class="font-mono" font-size="11" text-anchor="middle">Docker Container</text>

    <rect x="630" y="0" width="145" height="26" rx="5" fill="#102E20" stroke="#10B981" stroke-width="0.8"/>
    <text x="702" y="17" fill="#6EE7B7" class="font-mono" font-size="11" font-weight="600" text-anchor="middle">Cloud Native EdTech</text>
  </g>
</svg>
