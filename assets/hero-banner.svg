<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1D"/>
      <stop offset="50%" stop-color="#0D182E"/>
      <stop offset="100%" stop-color="#080F1D"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Electric Headline Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101F38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A1424" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0078D4" stroke-width="0.75" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Consolas', 'Fira Code', 'Roboto Mono', Monaco, monospace; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="1196" height="376" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Cyber Grid Background Overlay -->
  <rect x="2" y="2" width="1196" height="376" rx="16" fill="url(#gridPattern)"/>

  <!-- Subtle Glowing Orbs -->
  <circle cx="150" cy="80" r="160" fill="#0078D4" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="1020" cy="220" r="180" fill="#8B5CF6" fill-opacity="0.1" filter="url(#glow)"/>
  <circle cx="850" cy="80" r="120" fill="#38BDF8" fill-opacity="0.07" filter="url(#glow)"/>

  <!-- Left Content Area -->
  <g transform="translate(60, 48)">
    <!-- Top Terminal Badge -->
    <rect x="0" y="0" width="370" height="30" rx="15" fill="#10233F" stroke="#0078D4" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#38BDF8"/>
    <text x="28" y="19" fill="#93C5FD" class="font-mono" font-size="11.5" font-weight="600" letter-spacing="1">
      ENTERPRISE CLOUD &amp; DEVOPS PLATFORM
    </text>

    <!-- Main Headline -->
    <text x="0" y="90" fill="#EAF2FF" class="font-sans" font-size="44" font-weight="800" letter-spacing="-0.5">
      Engineering the Cloud.
    </text>
    <text x="0" y="146" fill="url(#textGrad)" class="font-sans" font-size="44" font-weight="800" letter-spacing="-0.5">
      Automating the Future.
    </text>

    <!-- Subtitle Role -->
    <text x="0" y="194" fill="#94A3B8" class="font-mono" font-size="15" font-weight="500">
      <tspan fill="#38BDF8">Gaurav Dubey</tspan> — Azure Cloud &amp; DevOps Engineer | IaC &amp; CI/CD
    </text>

    <!-- Core Technology Pills -->
    <g transform="translate(0, 222)">
      <!-- Pill 1: Terraform -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#13233D" stroke="#1E3A8A" stroke-width="1"/>
      <text x="65" y="18" fill="#BAE6FD" class="font-mono" font-size="11.5" font-weight="600" text-anchor="middle">🏗️ Terraform IaC</text>

      <!-- Pill 2: Azure Cloud -->
      <rect x="140" y="0" width="136" height="28" rx="6" fill="#13233D" stroke="#1E3A8A" stroke-width="1"/>
      <text x="208" y="18" fill="#BAE6FD" class="font-mono" font-size="11.5" font-weight="600" text-anchor="middle">☁️ Microsoft Azure</text>

      <!-- Pill 3: CI/CD -->
      <rect x="286" y="0" width="144" height="28" rx="6" fill="#13233D" stroke="#1E3A8A" stroke-width="1"/>
      <text x="358" y="18" fill="#BAE6FD" class="font-mono" font-size="11.5" font-weight="600" text-anchor="middle">🔄 CI/CD Pipelines</text>

      <!-- Pill 4: DevSecOps -->
      <rect x="440" y="0" width="130" height="28" rx="6" fill="#13233D" stroke="#1E3A8A" stroke-width="1"/>
      <text x="505" y="18" fill="#BAE6FD" class="font-mono" font-size="11.5" font-weight="600" text-anchor="middle">🛡️ DevSecOps</text>
    </g>

    <!-- Status Indicator Bar -->
    <g transform="translate(0, 276)">
      <rect x="0" y="0" width="450" height="26" rx="6" fill="#0C1B2E" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="16" cy="13" r="4.5" fill="#10B981"/>
      <text x="28" y="17" fill="#6EE7B7" class="font-mono" font-size="11" font-weight="600">
        SYSTEM STATUS: PRODUCTION READY • OPEN TO OPPORTUNITIES
      </text>
    </g>
  </g>

  <!-- Right Visual Area: Futuristic Cloud Architecture Isometric Graphic -->
  <g transform="translate(770, 40)">
    <!-- Outer Decorative Glow Ring -->
    <circle cx="210" cy="150" r="130" fill="none" stroke="#0078D4" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.3"/>
    <circle cx="210" cy="150" r="105" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.4"/>

    <!-- Central Infrastructure Dashboard Card -->
    <rect x="70" y="30" width="280" height="240" rx="14" fill="url(#cardGrad)" stroke="#0078D4" stroke-width="1.8" filter="url(#glow)"/>

    <!-- Card Header -->
    <rect x="70" y="30" width="280" height="38" rx="14" fill="#0F2445"/>
    <circle cx="92" cy="49" r="4.5" fill="#EF4444"/>
    <circle cx="106" cy="49" r="4.5" fill="#F59E0B"/>
    <circle cx="120" cy="49" r="4.5" fill="#10B981"/>
    <text x="140" y="53" fill="#93C5FD" class="font-mono" font-size="11" font-weight="600">azure-orchestrator.tf</text>

    <!-- Node 1: Root Orchestrator -->
    <g transform="translate(110, 85)">
      <rect x="0" y="0" width="200" height="34" rx="6" fill="#132B4F" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="12" y="21" fill="#38BDF8" class="font-mono" font-size="11" font-weight="700">ROOT</text>
      <text x="55" y="21" fill="#E2E8F0" class="font-mono" font-size="10.5">LandingZone::Prod</text>
      <circle cx="185" cy="17" r="4" fill="#10B981"/>
    </g>

    <!-- Connecting Bus Line -->
    <line x1="210" y1="120" x2="210" y2="135" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2"/>

    <!-- Node 2: Modules Stack -->
    <g transform="translate(90, 136)">
      <!-- Box A -->
      <rect x="0" y="0" width="115" height="32" rx="6" fill="#102442" stroke="#8B5CF6" stroke-width="1"/>
      <text x="8" y="19" fill="#A78BFA" class="font-mono" font-size="10" font-weight="600">mod_vnet</text>
      <text x="70" y="19" fill="#94A3B8" class="font-mono" font-size="9">v1.2.0</text>

      <!-- Box B -->
      <rect x="125" y="0" width="115" height="32" rx="6" fill="#102442" stroke="#8B5CF6" stroke-width="1"/>
      <text x="133" y="19" fill="#A78BFA" class="font-mono" font-size="10" font-weight="600">mod_nsg</text>
      <text x="195" y="19" fill="#94A3B8" class="font-mono" font-size="9">v1.0.1</text>
    </g>

    <line x1="147" y1="169" x2="147" y2="184" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="2 2"/>
    <line x1="272" y1="169" x2="272" y2="184" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="2 2"/>

    <!-- Node 3: CI/CD Pipeline Gate -->
    <g transform="translate(100, 185)">
      <rect x="0" y="0" width="220" height="36" rx="6" fill="#0C1D36" stroke="#0078D4" stroke-width="1"/>
      <circle cx="16" cy="18" r="4.5" fill="#38BDF8"/>
      <text x="28" y="16" fill="#E2E8F0" class="font-mono" font-size="9.5" font-weight="600">CI/CD: GitHub Actions</text>
      <text x="28" y="28" fill="#10B981" class="font-mono" font-size="9">Passed • tfsec: 0 issues</text>
    </g>

    <!-- Bottom Telemetry Metric -->
    <g transform="translate(110, 235)">
      <text x="0" y="15" fill="#64748B" class="font-mono" font-size="10">AUTOMATION RATE</text>
      <text x="135" y="15" fill="#38BDF8" class="font-mono" font-size="11" font-weight="700">100% IaC</text>
    </g>
  </g>
</svg>
