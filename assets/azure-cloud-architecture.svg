<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1D"/>
      <stop offset="50%" stop-color="#0D182E"/>
      <stop offset="100%" stop-color="#080F1D"/>
    </linearGradient>

    <linearGradient id="hubCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2A4A"/>
      <stop offset="100%" stop-color="#09182C"/>
    </linearGradient>

    <linearGradient id="spokeCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E38"/>
      <stop offset="100%" stop-color="#0A1224"/>
    </linearGradient>

    <linearGradient id="arrowBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0078D4" flood-opacity="0.15"/>
    </filter>

    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0078D4" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>

    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38BDF8"/>
    </marker>
    <marker id="arrowheadPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A78BFA"/>
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Consolas', 'Fira Code', 'Roboto Mono', Monaco, monospace; }
  </style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="996" height="456" rx="14" fill="url(#archBg)" stroke="#1E3A8A" stroke-width="1.5"/>
  <rect x="2" y="2" width="996" height="456" rx="14" fill="url(#archGrid)"/>

  <!-- Top Title Bar -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="165" height="24" rx="4" fill="#0078D4" fill-opacity="0.2" stroke="#0078D4" stroke-width="1"/>
    <text x="82" y="16" fill="#38BDF8" class="font-mono" font-size="10.5" font-weight="700" text-anchor="middle">AZURE ARCHITECTURE</text>
    <text x="180" y="17" fill="#EAF2FF" class="font-sans" font-size="18" font-weight="700">Enterprise Landing Zone — Secure Hub-and-Spoke Topology</text>
  </g>

  <!-- HUB VIRTUAL NETWORK (CENTER-LEFT) -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="360" height="340" rx="12" fill="url(#hubCardGrad)" stroke="#0078D4" stroke-width="1.8" filter="url(#cardShadow)"/>
    
    <!-- Hub Header -->
    <rect x="0" y="0" width="360" height="42" rx="12" fill="#0E2D52"/>
    <circle cx="24" cy="21" r="5" fill="#38BDF8"/>
    <text x="38" y="25" fill="#EAF2FF" class="font-mono" font-size="13" font-weight="700">HUB VIRTUAL NETWORK</text>
    <rect x="250" y="10" width="96" height="22" rx="4" fill="#0B1A30" stroke="#0078D4" stroke-width="0.8"/>
    <text x="298" y="25" fill="#93C5FD" class="font-mono" font-size="10" font-weight="600" text-anchor="middle">10.0.0.0/16</text>

    <!-- Subnet 1: Azure Firewall -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="320" height="68" rx="8" fill="#0B1C33" stroke="#1E40AF" stroke-width="1"/>
      <circle cx="20" cy="22" r="4" fill="#EF4444"/>
      <text x="32" y="26" fill="#FCA5A5" class="font-mono" font-size="11.5" font-weight="700">AzureFirewallSubnet</text>
      <text x="250" y="26" fill="#64748B" class="font-mono" font-size="10">10.0.1.0/24</text>
      <text x="32" y="48" fill="#94A3B8" class="font-sans" font-size="10.5">Central egress filtering • Threat intelligence • NAT</text>
    </g>

    <!-- Subnet 2: Azure Bastion -->
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="320" height="68" rx="8" fill="#0B1C33" stroke="#1E40AF" stroke-width="1"/>
      <circle cx="20" cy="22" r="4" fill="#38BDF8"/>
      <text x="32" y="26" fill="#93C5FD" class="font-mono" font-size="11.5" font-weight="700">AzureBastionSubnet</text>
      <text x="250" y="26" fill="#64748B" class="font-mono" font-size="10">10.0.2.0/24</text>
      <text x="32" y="48" fill="#94A3B8" class="font-sans" font-size="10.5">Secure browser-based RDP/SSH without public IPs</text>
    </g>

    <!-- Subnet 3: Gateway Subnet -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="320" height="68" rx="8" fill="#0B1C33" stroke="#1E40AF" stroke-width="1"/>
      <circle cx="20" cy="22" r="4" fill="#10B981"/>
      <text x="32" y="26" fill="#6EE7B7" class="font-mono" font-size="11.5" font-weight="700">GatewaySubnet</text>
      <text x="250" y="26" fill="#64748B" class="font-mono" font-size="10">10.0.0.0/24</text>
      <text x="32" y="48" fill="#94A3B8" class="font-sans" font-size="10.5">VPN / ExpressRoute cross-premises connectivity</text>
    </g>

    <!-- Bottom Hub Status -->
    <rect x="20" y="300" width="320" height="24" rx="4" fill="#061222"/>
    <text x="160" y="316" fill="#38BDF8" class="font-mono" font-size="10" text-anchor="middle">TRANSIT &amp; GOVERNANCE CONTROL PLANE</text>
  </g>

  <!-- SPOKE 1: APPLICATION WORKLOAD (TOP-RIGHT) -->
  <g transform="translate(580, 80)">
    <rect x="0" y="0" width="370" height="155" rx="12" fill="url(#spokeCardGrad)" stroke="#8B5CF6" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Spoke 1 Header -->
    <rect x="0" y="0" width="370" height="38" rx="12" fill="#1A1838"/>
    <circle cx="22" cy="19" r="4.5" fill="#A78BFA"/>
    <text x="35" y="23" fill="#EDE9FE" class="font-mono" font-size="12" font-weight="700">SPOKE 01: APPLICATION TIER</text>
    <rect x="270" y="8" width="86" height="20" rx="4" fill="#0D1022" stroke="#8B5CF6" stroke-width="0.8"/>
    <text x="313" y="22" fill="#C4B5FD" class="font-mono" font-size="9.5" text-anchor="middle">10.1.0.0/16</text>

    <!-- Content -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="330" height="84" rx="6" fill="#0E1428" stroke="#312E81" stroke-width="0.8"/>
      <text x="16" y="24" fill="#C4B5FD" class="font-mono" font-size="11" font-weight="600">App-Subnet (10.1.1.0/24)</text>
      <text x="16" y="44" fill="#E2E8F0" class="font-sans" font-size="11">Virtual Machine Scale Sets &amp; Web App Services</text>
      <text x="16" y="66" fill="#94A3B8" class="font-mono" font-size="10">🔒 NSG Protected • UDR Egress Routing</text>
    </g>
  </g>

  <!-- SPOKE 2: DATA & STORAGE TIER (BOTTOM-RIGHT) -->
  <g transform="translate(580, 265)">
    <rect x="0" y="0" width="370" height="155" rx="12" fill="url(#spokeCardGrad)" stroke="#8B5CF6" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Spoke 2 Header -->
    <rect x="0" y="0" width="370" height="38" rx="12" fill="#1A1838"/>
    <circle cx="22" cy="19" r="4.5" fill="#A78BFA"/>
    <text x="35" y="23" fill="#EDE9FE" class="font-mono" font-size="12" font-weight="700">SPOKE 02: DATA &amp; STORAGE TIER</text>
    <rect x="270" y="8" width="86" height="20" rx="4" fill="#0D1022" stroke="#8B5CF6" stroke-width="0.8"/>
    <text x="313" y="22" fill="#C4B5FD" class="font-mono" font-size="9.5" text-anchor="middle">10.2.0.0/16</text>

    <!-- Content -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="330" height="84" rx="6" fill="#0E1428" stroke="#312E81" stroke-width="0.8"/>
      <text x="16" y="24" fill="#C4B5FD" class="font-mono" font-size="11" font-weight="600">Data-Subnet (10.2.1.0/24)</text>
      <text x="16" y="44" fill="#E2E8F0" class="font-sans" font-size="11">Azure SQL Managed Instance &amp; Storage Accounts</text>
      <text x="16" y="66" fill="#94A3B8" class="font-mono" font-size="10">🛡️ Private Endpoints • Zero Public Ingress</text>
    </g>
  </g>

  <!-- BIDIRECTIONAL PEERING BUS LINES -->
  <!-- Line 1 to Spoke 1 -->
  <path d="M 410 160 L 490 160 L 580 160" fill="none" stroke="url(#arrowBlueGrad)" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="445" y="140" width="90" height="20" rx="4" fill="#08152B" stroke="#0078D4" stroke-width="1"/>
  <text x="490" y="154" fill="#38BDF8" class="font-mono" font-size="9" font-weight="700" text-anchor="middle">VNet Peering</text>

  <!-- Line 2 to Spoke 2 -->
  <path d="M 410 340 L 490 340 L 580 340" fill="none" stroke="url(#arrowBlueGrad)" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="445" y="320" width="90" height="20" rx="4" fill="#08152B" stroke="#0078D4" stroke-width="1"/>
  <text x="490" y="334" fill="#38BDF8" class="font-mono" font-size="9" font-weight="700" text-anchor="middle">VNet Peering</text>
</svg>
